spring:
  main:
    web-application-type: reactive

server:
  port: 9080

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

flowable:
  base-url: http://localhost:8080/flowable-external-worker-api
  username: admin
  password: test
  external:
    worker:
      rest:
        authentication:
          bearer:
            token: ${FLOWABLE_BEARER_TOKEN}

servicios:
  endpoint-url: http://localhost:8080/api/v1